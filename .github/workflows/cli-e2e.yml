name: CLI End-to-End

# Runs the CLI against a real Salesforce scratch org. It is not a required check. Only one run
# at a time, so only one scratch org exists at a time.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cli-e2e
  cancel-in-progress: false

env:
  # Dependabot and fork pull requests get no repository secrets, so the steps that log in to
  # Salesforce only run when the key is present.
  HAS_SF_SECRETS: ${{ secrets.SF_JWT_KEY != '' }}
  SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
  SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
  SF_USERNAME: ${{ vars.SF_USERNAME }}
  SF_DEVHUB_ORG_ID: ${{ vars.SF_DEVHUB_ORG_ID }}

jobs:
  e2e:
    name: Scratch org end to end
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Note skipped run
        if: env.HAS_SF_SECRETS != 'true'
        run: echo "::notice::Salesforce secrets are not available to this run, so the end-to-end run was skipped."

      - uses: actions/checkout@v7
        if: env.HAS_SF_SECRETS == 'true'

      - uses: docker/setup-buildx-action@v3
        if: env.HAS_SF_SECRETS == 'true'

      - name: Build the image
        if: env.HAS_SF_SECRETS == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: glassops:e2e
          build-args: VERSION=e2e-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the test repository
        if: env.HAS_SF_SECRETS == 'true'
        run: |
          sh testdata/sfdx/build-repo.sh "$RUNNER_TEMP/repo"
          cp testdata/e2e/glassops.yaml testdata/e2e/glassops-full.yaml "$RUNNER_TEMP/repo/"
          mkdir -p "$RUNNER_TEMP/scratch"

      - name: Doctor, with a login to the Dev Hub
        if: env.HAS_SF_SECRETS == 'true'
        run: |
          docker run --rm -e SF_JWT_KEY -e SF_CLIENT_ID -e SF_USERNAME -e SF_DEVHUB_ORG_ID \
            -e SF_EPHEMERAL_ORG_ID -e SF_EPHEMERAL_AUTH_URL \
            -v "$RUNNER_TEMP/repo:/work" -w /work \
            glassops:e2e doctor --auth --target devhub

      - name: Create the scratch org
        if: env.HAS_SF_SECRETS == 'true'
        run: |
          docker run --rm --entrypoint sh \
            -e SF_JWT_KEY -e SF_CLIENT_ID -e SF_USERNAME \
            -e OUT_OWNER="$(id -u):$(id -g)" \
            -v "$PWD/scripts/e2e:/scripts:ro" -v "$RUNNER_TEMP/scratch:/out" \
            glassops:e2e /scripts/scratch-create.sh /out

      - name: Hand the scratch org to later steps
        if: env.HAS_SF_SECRETS == 'true'
        run: |
          # Mask first, before the value is used anywhere else.
          url=$(cat "$RUNNER_TEMP/scratch/auth-url")
          echo "::add-mask::$url"
          org=$(tr -d ' \r\n' < "$RUNNER_TEMP/scratch/org-id")
          {
            echo "SF_EPHEMERAL_AUTH_URL=$url"
            echo "SF_EPHEMERAL_ORG_ID=$org"
          } >> "$GITHUB_ENV"

      - name: Plan the delta
        if: env.HAS_SF_SECRETS == 'true'
        run: |
          docker run --rm -e SF_JWT_KEY -e SF_CLIENT_ID -e SF_USERNAME -e SF_DEVHUB_ORG_ID \
            -e SF_EPHEMERAL_ORG_ID -e SF_EPHEMERAL_AUTH_URL \
            -v "$RUNNER_TEMP/repo:/work" -w /work \
            glassops:e2e plan --from HEAD~1 --to HEAD

      - name: Check the delta holds one destructive change
        if: env.HAS_SF_SECRETS == 'true'
        run: |
          cp "$RUNNER_TEMP/repo/.glassops/plan.json" "$RUNNER_TEMP/repo/.glassops/plan-delta.json"
          node -e '
            const p = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const n = (p.destructive || []).length;
            const c = (p.facts || {})["salesforce.destructive_count"];
            if (n !== 1 || c !== 1) {
              console.error("expected one destructive entry and destructive_count 1, got " + n + " and " + c);
              process.exit(1);
            }
            console.log("delta plan holds one destructive change");
          ' "$RUNNER_TEMP/repo/.glassops/plan-delta.json"

      # A check-only validate never deploys commit 1, so the delta's destructive change would
      # name a field the scratch org never had. The validate runs the full source instead.
      - name: Plan the full source
        if: env.HAS_SF_SECRETS == 'true'
        run: |
          docker run --rm -e SF_JWT_KEY -e SF_CLIENT_ID -e SF_USERNAME -e SF_DEVHUB_ORG_ID \
            -e SF_EPHEMERAL_ORG_ID -e SF_EPHEMERAL_AUTH_URL \
            -v "$RUNNER_TEMP/repo:/work" -w /work \
            glassops:e2e plan --config /work/glassops-full.yaml

      - name: Validate against the scratch org
        if: env.HAS_SF_SECRETS == 'true'
        run: |
          docker run --rm -e SF_JWT_KEY -e SF_CLIENT_ID -e SF_USERNAME -e SF_DEVHUB_ORG_ID \
            -e SF_EPHEMERAL_ORG_ID -e SF_EPHEMERAL_AUTH_URL \
            -v "$RUNNER_TEMP/repo:/work" -w /work \
            glassops:e2e validate --target ephemeral --config /work/glassops-full.yaml

      - name: Look for a scratch org to delete
        id: scratch
        if: always() && env.HAS_SF_SECRETS == 'true'
        run: |
          if [ -s "$RUNNER_TEMP/scratch/org-id" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No scratch org Id was recorded, so there is nothing to delete."
          fi

      - name: Delete the scratch org
        if: always() && env.HAS_SF_SECRETS == 'true' && steps.scratch.outputs.exists == 'true'
        run: |
          docker run --rm --entrypoint sh \
            -e SF_JWT_KEY -e SF_CLIENT_ID -e SF_USERNAME \
            -v "$PWD/scripts/e2e:/scripts:ro" -v "$RUNNER_TEMP/scratch:/out" \
            glassops:e2e /scripts/scratch-delete.sh /out

      - name: Upload results
        if: always() && env.HAS_SF_SECRETS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: glassops-e2e
          path: |
            ${{ runner.temp }}/repo/.glassops/results/
            ${{ runner.temp }}/repo/.glassops/plan.json
            ${{ runner.temp }}/repo/.glassops/plan-delta.json
          if-no-files-found: warn
