name: CLI End-to-End

# Two jobs. "exec" runs the exec provider end to end with no outside system and no secrets, so
# it runs on every push to main and every pull request. "e2e" runs the CLI against a real
# Salesforce scratch org. It is not a required check, never runs for a pull request, and only
# one run at a time, so only one scratch org exists at a time. The same pipeline runs every
# night in e2e-nightly.yml.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "all runs every part, pipeline runs only the glassops run part (one scratch org)"
        type: choice
        options: [all, pipeline]
        default: all
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Dependabot and fork pull requests get no repository secrets, so the steps that log in to
  # Salesforce only run when the key is present.
  HAS_SF_SECRETS: ${{ secrets.SF_JWT_KEY != '' }}
  SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
  SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
  SF_USERNAME: ${{ secrets.SF_USERNAME }}
  SF_DEVHUB_ORG_ID: ${{ secrets.SF_DEVHUB_ORG_ID }}

jobs:
  exec:
    name: Exec provider end to end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: glassops:e2e
          build-args: VERSION=e2e-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The target is a temp directory inside the container. The container gets no credentials
      # and no network, and the script exits 0 only when every refusal refused. The binary is
      # passed by path: exec-e2e.sh defines a shell function named glassops, so the bare name
      # would call the function again and never reach the binary.
      - name: Run the exec provider end to end
        run: |
          docker run --rm --network none --entrypoint sh \
            -v "$PWD/scripts/e2e:/scripts:ro" \
            glassops:e2e /scripts/exec-e2e.sh /usr/local/bin/glassops

  e2e:
    name: Scratch org end to end
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: cli-e2e
      cancel-in-progress: false
    steps:
      - name: Note skipped run
        if: env.HAS_SF_SECRETS != 'true'
        run: echo "::notice::Salesforce secrets are not available to this run, so the end-to-end run was skipped."

      - uses: actions/checkout@v7
        if: env.HAS_SF_SECRETS == 'true'

      - uses: docker/setup-buildx-action@v4
        if: env.HAS_SF_SECRETS == 'true'

      - name: Build the image
        if: env.HAS_SF_SECRETS == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: glassops:e2e
          build-args: VERSION=e2e-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the test repository
        if: env.HAS_SF_SECRETS == 'true'
        run: |
          sh testdata/sfdx/build-repo.sh "$RUNNER_TEMP/repo"
          cp testdata/e2e/glassops.yaml testdata/e2e/glassops-full.yaml "$RUNNER_TEMP/repo/"
          mkdir -p "$RUNNER_TEMP/scratch"

      - name: Doctor, with a login to the Dev Hub
        if: env.HAS_SF_SECRETS == 'true' && inputs.scope != 'pipeline'
        run: |
          docker run --rm -e SF_JWT_KEY -e SF_CLIENT_ID -e SF_USERNAME -e SF_DEVHUB_ORG_ID \
            -e SF_EPHEMERAL_ORG_ID -e SF_EPHEMERAL_AUTH_URL \
            -v "$RUNNER_TEMP/repo:/work" -w /work \
            glassops:e2e doctor --auth --target devhub

      - name: Create the scratch org
        if: env.HAS_SF_SECRETS == 'true' && inputs.scope != 'pipeline'
        run: |
          docker run --rm --entrypoint sh \
            -e SF_JWT_KEY -e SF_CLIENT_ID -e SF_USERNAME \
            -e OUT_OWNER="$(id -u):$(id -g)" \
            -v "$PWD/scripts/e2e:/scripts:ro" -v "$RUNNER_TEMP/scratch:/out" \
            glassops:e2e /scripts/scratch-create.sh /out

      - name: Hand the scratch org to later steps
        if: env.HAS_SF_SECRETS == 'true' && inputs.scope != 'pipeline'
        run: |
          # Mask first, before the value is used anywhere else.
          url=$(cat "$RUNNER_TEMP/scratch/auth-url")
          echo "::add-mask::$url"
          org=$(tr -d ' \r\n' < "$RUNNER_TEMP/scratch/org-id")
          {
            echo "SF_EPHEMERAL_AUTH_URL=$url"
            echo "SF_EPHEMERAL_ORG_ID=$org"
          } >> "$GITHUB_ENV"

      - name: Plan the delta
        if: env.HAS_SF_SECRETS == 'true' && inputs.scope != 'pipeline'
        run: |
          docker run --rm -e SF_JWT_KEY -e SF_CLIENT_ID -e SF_USERNAME -e SF_DEVHUB_ORG_ID \
            -e SF_EPHEMERAL_ORG_ID -e SF_EPHEMERAL_AUTH_URL \
            -v "$RUNNER_TEMP/repo:/work" -w /work \
            glassops:e2e plan --from HEAD~1 --to HEAD

      - name: Check the delta holds one destructive change
        if: env.HAS_SF_SECRETS == 'true' && inputs.scope != 'pipeline'
        run: |
          # The container runs as root and owns .glassops/, so the copy goes next to it.
          cp "$RUNNER_TEMP/repo/.glassops/plan.json" "$RUNNER_TEMP/plan-delta.json"
          node -e '
            const p = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const n = (p.destructive || []).length;
            const c = (p.facts || {})["salesforce.destructive_count"];
            if (n !== 1 || c !== 1) {
              console.error("expected one destructive entry and destructive_count 1, got " + n + " and " + c);
              process.exit(1);
            }
            console.log("delta plan holds one destructive change");
          ' "$RUNNER_TEMP/plan-delta.json"

      # A check-only validate never deploys commit 1, so the delta's destructive change would
      # name a field the scratch org never had. The validate runs the full source instead.
      - name: Plan the full source
        if: env.HAS_SF_SECRETS == 'true' && inputs.scope != 'pipeline'
        run: |
          docker run --rm -e SF_JWT_KEY -e SF_CLIENT_ID -e SF_USERNAME -e SF_DEVHUB_ORG_ID \
            -e SF_EPHEMERAL_ORG_ID -e SF_EPHEMERAL_AUTH_URL \
            -v "$RUNNER_TEMP/repo:/work" -w /work \
            glassops:e2e plan --config /work/glassops-full.yaml

      - name: Validate against the scratch org
        if: env.HAS_SF_SECRETS == 'true' && inputs.scope != 'pipeline'
        run: |
          docker run --rm -e SF_JWT_KEY -e SF_CLIENT_ID -e SF_USERNAME -e SF_DEVHUB_ORG_ID \
            -e SF_EPHEMERAL_ORG_ID -e SF_EPHEMERAL_AUTH_URL \
            -v "$RUNNER_TEMP/repo:/work" -w /work \
            glassops:e2e validate --target ephemeral --config /work/glassops-full.yaml

      # Phase 3: gate, a tampered PERMIT, a real deploy into the scratch org and the deployed tag.
      # The key is a throwaway made in this job, never the deploy environment's key.
      - name: Make a throwaway PERMIT key and a bare origin
        if: env.HAS_SF_SECRETS == 'true'
        run: |
          key=$(openssl rand -base64 32)
          echo "::add-mask::$key"
          echo "GLASSOPS_PERMIT_KEY=$key" >> "$GITHUB_ENV"
          git init -q --bare "$RUNNER_TEMP/origin.git"
          git -C "$RUNNER_TEMP/repo" remote add origin /origin.git

      - name: Gate the validated plan
        if: env.HAS_SF_SECRETS == 'true' && inputs.scope != 'pipeline'
        run: |
          docker run --rm -e SF_EPHEMERAL_ORG_ID -e SF_EPHEMERAL_AUTH_URL -e GLASSOPS_PERMIT_KEY \
            -v "$RUNNER_TEMP/repo:/work" -w /work \
            glassops:e2e gate --target ephemeral --config /work/glassops-full.yaml --ci local
          node -e '
            const p = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const bound = (p.checks || []).find(c => c.rule === "validation.bound");
            if (!p.allow || !p.validation || !p.validation.deploy_id || !bound || bound.outcome !== "pass") {
              console.error("expected an allowing PERMIT with the validation bound, got allow=" + p.allow + " bound=" + JSON.stringify(bound));
              process.exit(1);
            }
            console.log("PERMIT allows the deploy and binds validation " + p.validation.deploy_id);
          ' "$RUNNER_TEMP/repo/.glassops/permit.json"

      - name: A tampered PERMIT is refused before any login
        if: env.HAS_SF_SECRETS == 'true' && inputs.scope != 'pipeline'
        run: |
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            p.plan_sha256 = "0".repeat(64);
            fs.writeFileSync(process.argv[2], JSON.stringify(p));
          ' "$RUNNER_TEMP/repo/.glassops/permit.json" "$RUNNER_TEMP/permit-tampered.json"
          run() {
            docker run --rm -e SF_EPHEMERAL_ORG_ID -e SF_EPHEMERAL_AUTH_URL -e GLASSOPS_PERMIT_KEY \
              -v "$RUNNER_TEMP/repo:/work" -v "$RUNNER_TEMP/permit-tampered.json:/tampered.json:ro" -w /work \
              glassops:e2e "$@" --config /work/glassops-full.yaml --ci local
          }
          set +e
          run permit verify --target ephemeral --permit /tampered.json; verify=$?
          run deploy --target ephemeral --permit /tampered.json; deploy=$?
          set -e
          if [ "$verify" != 1 ] || [ "$deploy" != 2 ]; then
            echo "expected permit verify to exit 1 and deploy to exit 2, got $verify and $deploy" >&2
            exit 1
          fi
          node -e '
            const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            if ((r.facts || {})["salesforce.deploy_id"]) { console.error("the tampered deploy reached the org"); process.exit(1); }
            console.log("tampered PERMIT refused by permit verify and by deploy, nothing deployed");
          ' "$RUNNER_TEMP/repo/.glassops/results/deploy.json"

      - name: Verify the PERMIT
        if: env.HAS_SF_SECRETS == 'true' && inputs.scope != 'pipeline'
        run: |
          docker run --rm -e SF_EPHEMERAL_ORG_ID -e SF_EPHEMERAL_AUTH_URL -e GLASSOPS_PERMIT_KEY \
            -v "$RUNNER_TEMP/repo:/work" -w /work \
            glassops:e2e permit verify --target ephemeral --config /work/glassops-full.yaml --ci local

      - name: Deploy into the scratch org
        if: env.HAS_SF_SECRETS == 'true' && inputs.scope != 'pipeline'
        run: |
          docker run --rm -e SF_EPHEMERAL_ORG_ID -e SF_EPHEMERAL_AUTH_URL -e GLASSOPS_PERMIT_KEY \
            -v "$RUNNER_TEMP/repo:/work" -v "$RUNNER_TEMP/origin.git:/origin.git" -w /work \
            glassops:e2e deploy --target ephemeral --config /work/glassops-full.yaml --ci local
          node -e '
            const f = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).facts || {};
            const ok = f["salesforce.deploy_status"] === "Succeeded" && f["deploy.quick"] === true && f["deploy.tag_pushed"] === true;
            if (!ok) { console.error("unexpected deploy facts: " + JSON.stringify(f)); process.exit(1); }
            console.log("quick deployed " + f["salesforce.deploy_id"] + " and pushed the deployed tag");
          ' "$RUNNER_TEMP/repo/.glassops/results/deploy.json"
          head=$(git -C "$RUNNER_TEMP/repo" rev-parse HEAD)
          tag=$(git -C "$RUNNER_TEMP/origin.git" rev-parse refs/tags/glassops/deployed/ephemeral)
          if [ "$head" != "$tag" ]; then echo "deployed tag is $tag, HEAD is $head" >&2; exit 1; fi

      # run deploy ends with verify, so the e2e checks the same step against the real org.
      - name: Verify the deploy
        if: env.HAS_SF_SECRETS == 'true' && inputs.scope != 'pipeline'
        run: |
          docker run --rm -e SF_EPHEMERAL_ORG_ID -e SF_EPHEMERAL_AUTH_URL \
            -v "$RUNNER_TEMP/repo:/work" -w /work \
            glassops:e2e verify --target ephemeral --config /work/glassops-full.yaml --ci local
          node -e '
            const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const f = r.facts || {};
            const bad = (r.checks || []).filter(c => c.status !== "pass" && c.status !== "skipped");
            if (r.status !== "pass" || f["verify.passed"] !== true || f["verify.check_only"] !== false || bad.length) {
              console.error("verify did not pass: status " + r.status + ", failing checks " + JSON.stringify(bad));
              process.exit(1);
            }
            console.log("verify passed on deploy " + f["verify.deploy_id"]);
          ' "$RUNNER_TEMP/repo/.glassops/results/verify.json"

      - name: Plan from the deployed tag
        if: env.HAS_SF_SECRETS == 'true' && inputs.scope != 'pipeline'
        run: |
          docker run --rm -e SF_EPHEMERAL_ORG_ID -e SF_EPHEMERAL_AUTH_URL \
            -v "$RUNNER_TEMP/repo:/work" -w /work \
            glassops:e2e plan --target ephemeral --ci local
          node -e '
            const p = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            if (!p.empty) { console.error("expected an empty plan from the deployed tag"); process.exit(1); }
            console.log("plan from the deployed tag is empty");
          ' "$RUNNER_TEMP/repo/.glassops/plan.json"

      - name: Report
        if: always() && env.HAS_SF_SECRETS == 'true' && inputs.scope != 'pipeline'
        run: |
          docker run --rm -v "$RUNNER_TEMP/repo:/work" -w /work \
            glassops:e2e report --ci local --summary /work/.glassops/summary.md --sarif /work/.glassops/report.sarif
          cat "$RUNNER_TEMP/repo/.glassops/summary.md" >> "$GITHUB_STEP_SUMMARY"

      # Phase 4 and 5: one glassops run in one container. It plans a delta that deletes a field,
      # creates a scratch org from a definition with settings, checks the org's Mobile settings,
      # seeds the deleted field so the validate can pass, gates and deploys into the created org,
      # verifies the deploy, runs the tests there with the coverage gate, runs an exec step,
      # reports and deletes the org. The same scripts run in e2e-nightly.yml.
      - name: Run a pipeline with a created scratch org
        if: env.HAS_SF_SECRETS == 'true'
        run: |
          set +e
          sh scripts/e2e/scratch-pipeline-run.sh "$RUNNER_TEMP/repo4" glassops:e2e
          code=$?
          set -e
          cat "$RUNNER_TEMP/repo4/.glassops/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
          sh scripts/e2e/scratch-pipeline-check.sh "$RUNNER_TEMP/repo4/.glassops/results"
          exit $code

      - name: Sweep any scratch org the pipeline left
        if: always() && env.HAS_SF_SECRETS == 'true'
        run: |
          [ -f "$RUNNER_TEMP/repo4/glassops.yaml" ] || exit 0
          docker run --rm -e SF_JWT_KEY -e SF_CLIENT_ID -e SF_USERNAME -e SF_DEVHUB_ORG_ID \
            -v "$RUNNER_TEMP/repo4:/work" -w /work \
            glassops:e2e env sweep --max-age 1s --ci local

      - name: Look for a scratch org to delete
        id: scratch
        if: always() && env.HAS_SF_SECRETS == 'true'
        run: |
          if [ -s "$RUNNER_TEMP/scratch/org-id" ] || [ -s "$RUNNER_TEMP/scratch/scratch-info-id" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No scratch org or signup was recorded, so there is nothing to delete."
          fi

      - name: Delete the scratch org
        if: always() && env.HAS_SF_SECRETS == 'true' && steps.scratch.outputs.exists == 'true'
        run: |
          docker run --rm --entrypoint sh \
            -e SF_JWT_KEY -e SF_CLIENT_ID -e SF_USERNAME \
            -v "$PWD/scripts/e2e:/scripts:ro" -v "$RUNNER_TEMP/scratch:/out" \
            glassops:e2e /scripts/scratch-delete.sh /out

      - name: Upload results
        if: always() && env.HAS_SF_SECRETS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: glassops-e2e
          path: |
            ${{ runner.temp }}/repo/.glassops/results/
            ${{ runner.temp }}/repo/.glassops/plan.json
            ${{ runner.temp }}/plan-delta.json
            ${{ runner.temp }}/repo/.glassops/permit.json
            ${{ runner.temp }}/repo/.glassops/facts.json
            ${{ runner.temp }}/repo/.glassops/summary.md
            ${{ runner.temp }}/repo/.glassops/report.sarif
            ${{ runner.temp }}/repo4/.glassops/results/
          if-no-files-found: warn
