name: glassops pr

# A reusable workflow. Call it from a pull_request workflow:
#   jobs:
#     glassops:
#       uses: glassops-platform/glassops/.github/workflows/glassops-pr.yml@v1
#       permissions: { contents: read, pull-requests: read, security-events: write }
#       secrets: inherit
# It never receives the permit key. Only the deploy workflow does, from its environment.
on:
  workflow_call:
    inputs:
      image:
        description: The GlassOps container image. A consumer that sets analyze.enabled in glassops.yaml passes the glassops-analyzer image, for example ghcr.io/glassops-platform/glassops-analyzer:v1.
        type: string
        default: ghcr.io/glassops-platform/glassops:v1
      targets:
        description: Space separated target names to log in to before the pipeline, so a bad login fails early.
        type: string
        default: ''
      upload-sarif:
        description: Upload the SARIF file to code scanning. Needs GitHub code scanning on the repository.
        type: boolean
        default: true
    secrets:
      SF_JWT_KEY:
        required: false
      SF_CLIENT_ID:
        required: false
      SF_USERNAME:
        required: false
      SF_DEVHUB_ORG_ID:
        required: false
      SF_PROD_USERNAME:
        required: false
      SF_PROD_ORG_ID:
        required: false

permissions:
  contents: read

jobs:
  pr:
    name: glassops run pr
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    container: ${{ inputs.image }}
    env:
      SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
      SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
      SF_USERNAME: ${{ secrets.SF_USERNAME }}
      SF_DEVHUB_ORG_ID: ${{ secrets.SF_DEVHUB_ORG_ID }}
      SF_PROD_USERNAME: ${{ secrets.SF_PROD_USERNAME }}
      SF_PROD_ORG_ID: ${{ secrets.SF_PROD_ORG_ID }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - id: checkout
        uses: actions/checkout@v4
        with:
          # Full history, so the change set between the base and the head is complete.
          fetch-depth: 0

      - name: Log in to each target
        if: inputs.targets != ''
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          for t in $TARGETS; do
            glassops doctor --auth --target "$t"
          done

      - id: pipeline
        name: Run the pr pipeline
        run: glassops run pr

      - name: Report
        if: always() && steps.checkout.outcome == 'success'
        run: glassops report

      - name: Upload SARIF
        if: always() && inputs.upload-sarif && steps.checkout.outcome == 'success' && hashFiles('.glassops/report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .glassops/report.sarif
          category: glassops
