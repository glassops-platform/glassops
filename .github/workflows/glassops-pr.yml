name: glassops pr

# A reusable workflow. Call it from a pull_request workflow:
#   jobs:
#     glassops:
#       uses: glassops-platform/glassops/.github/workflows/glassops-pr.yml@v1
#       permissions: { contents: read, pull-requests: write, security-events: write }
#       secrets: inherit
# The job posts the report comment, so it has pull-requests: write and the caller must grant it. A
# pull request from a fork gets a read-only token, and the comment then warns and is not posted.
# It never receives the permit key. Only the deploy workflow does, from its environment.
# glassops runs in its container, one docker run per command. The checkout and the uploads run on
# the runner. A consumer that sets analyze.enabled passes the glassops-analyzer image as image.
on:
  workflow_call:
    inputs:
      image:
        description: The GlassOps container image. Empty means the image of the release this workflow is called at, for example ghcr.io/glassops-platform/glassops:v1.2.3 for @v1 when v1.2.3 is the current release. A consumer that sets analyze.enabled in glassops.yaml passes the glassops-analyzer image at the same version. Pass a digest for a fully pinned run.
        type: string
        default: ''
      targets:
        description: Space separated target names to log in to before the pipeline, so a bad login fails early.
        type: string
        default: ''
      upload-sarif:
        description: Upload the SARIF file to code scanning. Needs GitHub code scanning on the repository.
        type: boolean
        default: true
    secrets:
      SF_JWT_KEY:
        required: false
      SF_CLIENT_ID:
        required: false
      SF_USERNAME:
        required: false
      SF_DEVHUB_ORG_ID:
        required: false
      SF_PROD_USERNAME:
        required: false
      SF_PROD_ORG_ID:
        required: false

permissions:
  contents: read

jobs:
  pr:
    name: glassops run pr
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - id: checkout
        uses: actions/checkout@v4
        with:
          # Full history, so the change set between the base and the head is complete.
          fetch-depth: 0

      - name: Install the glassops command
        env:
          INPUT_IMAGE: ${{ inputs.image }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          # The image: the input when it is set. Otherwise the image of the release this workflow
          # file comes from. job.workflow_sha is the commit of this file, a release tag such as
          # v1 or v1.2.3 points at that same commit, so the full version tag on it names the image.
          image="$INPUT_IMAGE"
          if [ -z "$image" ]; then
            tags="$(git ls-remote --tags "$GITHUB_SERVER_URL/glassops-platform/glassops.git" 2>/dev/null |
              awk -v sha="$WORKFLOW_SHA" '$1 == sha {
                n = $2
                sub("^refs/tags/", "", n)
                if (substr(n, length(n) - 2) == "^{}") n = substr(n, 1, length(n) - 3)
                print n
              }' || true)"
            # A final release wins over a prerelease tag on the same commit.
            tag="$(echo "$tags" | grep -E '^v[0-9]+[.][0-9]+[.][0-9]+$' | sort -V | tail -n 1 || true)"
            if [ -z "$tag" ]; then
              tag="$(echo "$tags" | grep -E '^v[0-9]+[.][0-9]+[.][0-9]+-[0-9A-Za-z.-]+$' | sort -V | tail -n 1 || true)"
            fi
            if [ -z "$tag" ]; then
              echo "::error::This workflow file is not at a glassops release, so it has no default image. Call it at a release tag (@v1 or @v1.2.3) or pass the image input."
              exit 1
            fi
            image="ghcr.io/glassops-platform/glassops:$tag"
          fi
          echo "glassops image: $image"

          # glassops runs in its image, one container per command, with the workspace mounted.
          # The runner keeps the JavaScript actions (checkout, uploads), because the Alpine
          # image cannot run them.
          mkdir -p "$RUNNER_TEMP/glassops-bin"
          cat > "$RUNNER_TEMP/glassops-bin/glassops" <<'WRAPPER'
          #!/usr/bin/env bash
          set -u
          names=(
            GITHUB_ACTIONS
            GITHUB_REPOSITORY
            GITHUB_SHA
            GITHUB_REF
            GITHUB_EVENT_NAME
            GITHUB_ACTOR
            GITHUB_TRIGGERING_ACTOR
            GITHUB_RUN_ID
            GITHUB_BASE_REF
            GITHUB_API_URL
            GITHUB_SERVER_URL
            GITHUB_TOKEN
            SF_JWT_KEY
            SF_CLIENT_ID
            SF_USERNAME
            SF_DEVHUB_ORG_ID
            SF_PROD_USERNAME
            SF_PROD_ORG_ID
          )
          args=(run --rm -v "$GITHUB_WORKSPACE:/work" -w /work)
          for n in "${names[@]}" ${GLASSOPS_PASS_ENV:-}; do
            args+=(-e "$n")
          done
          for f in GITHUB_OUTPUT GITHUB_STEP_SUMMARY; do
            p="${!f:-}"
            if [ -n "$p" ]; then args+=(-e "$f" -v "$p:$p"); fi
          done
          exec docker "${args[@]}" "$GLASSOPS_IMAGE" "$@"
          WRAPPER
          chmod +x "$RUNNER_TEMP/glassops-bin/glassops"
          echo "$RUNNER_TEMP/glassops-bin" >> "$GITHUB_PATH"
          echo "GLASSOPS_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Log in to each target
        if: inputs.targets != ''
        env:
          TARGETS: ${{ inputs.targets }}
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_DEVHUB_ORG_ID: ${{ secrets.SF_DEVHUB_ORG_ID }}
          SF_PROD_USERNAME: ${{ secrets.SF_PROD_USERNAME }}
          SF_PROD_ORG_ID: ${{ secrets.SF_PROD_ORG_ID }}
        run: |
          for t in $TARGETS; do
            glassops doctor --auth --target "$t"
          done

      - id: pipeline
        name: Run the pr pipeline
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_DEVHUB_ORG_ID: ${{ secrets.SF_DEVHUB_ORG_ID }}
          SF_PROD_USERNAME: ${{ secrets.SF_PROD_USERNAME }}
          SF_PROD_ORG_ID: ${{ secrets.SF_PROD_ORG_ID }}
        run: glassops run pr

      - name: Report
        if: always() && steps.checkout.outcome == 'success'
        run: glassops report

      - name: Upload SARIF
        if: always() && inputs.upload-sarif && steps.checkout.outcome == 'success' && hashFiles('.glassops/report.sarif') != ''
        # A pull request from a fork has no security-events: write, so this must not fail the run.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .glassops/report.sarif
          category: glassops
