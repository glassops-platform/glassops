version: 2
project_name: glassops

builds:
  - id: glassops
    main: ./cmd/glassops
    binary: glassops
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github

release:
  # Releases start as drafts. Publishing one is a deliberate step.
  draft: true
