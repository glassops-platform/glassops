site_name: GlassOps
site_description: A CI-agnostic CLI for governed Salesforce deployments
site_author: Ryan Bumstead
site_url: https://glassops-platform.github.io/glassops/

repo_name: glassops-platform/glassops
repo_url: https://github.com/glassops-platform/glassops

# Documentation source is the repository root
docs_dir: ..
# Build output must be outside of docs_dir (project root) to avoid infinite loop
site_dir: ../../glassops_site_build

theme:
    name: material
    palette:
        # Light mode
        - media: "(prefers-color-scheme: light)"
          scheme: default
          primary: indigo
          accent: deep purple
          toggle:
              icon: material/weather-sunny
              name: Switch to dark mode
        # Dark mode
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          primary: indigo
          accent: deep purple
          toggle:
              icon: material/weather-night
              name: Switch to light mode
    features:
        - navigation.indexes
        - navigation.tabs
        - navigation.sections
        - navigation.expand
        - content.code.copy
        - content.action.edit

markdown_extensions:
    - admonition
    - pymdownx.details
    - pymdownx.superfences:
          custom_fences:
              - name: mermaid
                class: mermaid
                format: !!python/name:pymdownx.superfences.fence_code_format
    - pymdownx.tabbed:
          alternate_style: true
    - pymdownx.highlight:
          anchor_linenums: true
    - attr_list
    - md_in_html

plugins:
    - search

exclude_docs: |
    **node_modules/**
    **venv/**
    **__pycache__/**
    **dist/**
    **build/**
    **coverage/**
    **docs_staging/**
    **glassops_site/**
    **docs/internal/**
    # Design history. These files stay in the repository and are left off the site,
    # because they describe direction and earlier designs, not the released CLI.
    /docs/vision.md
    /docs/whitepaper.md
    /docs/doc-map.md
    /docs/adr-index.md
    /docs/adr/
    /docs/reference/platform-reference.md

# A link to a missing page or a missing heading is a warning, and scripts/build-docs.py builds
# with --strict, so any warning fails the build.
validation:
    links:
        not_found: warn
        anchors: warn

nav:
    - Home: README.md

    - Guides:
          - "Run a Pipeline": docs/guides/run-a-pipeline.md
          - "Deploy with GitHub": docs/guides/deploy-with-github.md
          - "Bitbucket and GitLab": docs/guides/other-ci.md
          - "Scratch Org Settings": docs/guides/scratch-org-settings.md

    - Reference:
          - "CLI Reference": docs/reference/cli.md
          - "Configuration Reference": docs/reference/config.md
          - "PERMIT and Rules": docs/reference/permit-and-rules.md
          - "Exec Provider": docs/reference/exec-provider.md
          - "Sigstore Signing": docs/reference/sigstore-signing.md
          - "Rego Rules": docs/reference/rego-rules.md
          - "PR Comment and OpenTelemetry": docs/reference/pr-comment-and-telemetry.md
          - "Verify, Coverage and YAML Settings": docs/reference/verify-and-coverage-settings.md
          - "Releases, Images and Licenses": docs/reference/releases-and-licenses.md
          - "Examples": examples/README.md

    - Architecture: docs/architecture/overview.md

    - Project:
          - "Contributing": CONTRIBUTING.md
          - "Code License": https://github.com/glassops-platform/glassops/blob/main/LICENSE
          - "Docs License": https://github.com/glassops-platform/glassops/blob/main/docs/LICENSE
